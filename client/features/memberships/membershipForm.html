<div class="feature-header">

    <h2 id="membershipFormTitle">

        💳 Nueva Membresía

    </h2>

    <p id="membershipFormDescription">

        Completa la información para registrar una nueva membresía.

    </p>

</div>

<form id="membershipForm" class="fm-form">

    <input type="hidden" id="membershipId">

    <!-- Información General -->

    <section class="fm-section">

        <h3 class="fm-section-title">

            Información General

        </h3>

        <div class="fm-grid">

            <div class="fm-group">

                <label for="membershipName">

                    Nombre *

                </label>

                <input type="text" id="membershipName" required>

            </div>

            <div class="fm-group">

                <label for="membershipPrice">

                    Precio *

                </label>

                <input type="number" id="membershipPrice" min="0" step="0.01" required>

            </div>

            <div class="fm-group">

                <label for="membershipClasses">

                    Número de clases

                </label>

                <input type="number" id="membershipClasses" min="0" placeholder="Vacío = Ilimitadas">

            </div>

            <div class="fm-group">

                <label for="membershipDuration">

                    Duración (días) *

                </label>

                <input type="number" id="membershipDuration" min="1" required>

            </div>

            <div class="fm-group fm-full">

                <label for="membershipDescription">

                    Descripción

                </label>

                <textarea id="membershipDescription" rows="4"></textarea>

            </div>

        </div>

    </section>

    <div class="fm-form-actions">

        <button type="button" id="cancelMembership" class="fm-btn fm-btn-secondary">

            Cancelar

        </button>

        <button type="submit" id="saveMembership" class="fm-btn fm-btn-primary">

            Guardar Membresía

        </button>

    </div>

</form>
