<div class="clients-page">


    <!-- =====================================
         SEARCH
    ====================================== -->

    <div class="client-search-wrapper">

        <span class="material-symbols-outlined client-search-icon">

            search

        </span>


        <input type="text" id="searchClient" class="client-search-input" placeholder="Buscar cliente..."
            autocomplete="off">


        <!-- =====================================
             TEMPORARY SEARCH RESULTS
        ====================================== -->

        <div id="results" class="client-search-results"></div>

    </div>


    <!-- =====================================
         CLIENT PROFILE
    ====================================== -->

    <main id="clientProfile" class="client-details">

        <div class="empty-state client-empty-profile">

            <span class="material-symbols-outlined">

                person_search

            </span>


            <h2>

                Busca un cliente

            </h2>


            <p>

                Utiliza la barra de búsqueda para
                encontrar y consultar un cliente.

            </p>

        </div>

    </main>


    <!-- =====================================
         FLOATING NEW CLIENT BUTTON
    ====================================== -->

    <button id="newClient" class="fm-btn fm-btn-primary new-client-btn">

        <span class="material-symbols-outlined">

            person_add

        </span>

        Nuevo cliente

    </button>


</div>
